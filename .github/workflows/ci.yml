name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless-tests:
    name: Engine + graph tests (no audio hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Module / synthdef / patch smoke test
        run: python tests/smoke.py

      - name: Graph + control-plane tests
        run: python tests/test_graph.py

      - name: Loop deck tests
        run: python tests/test_looper.py

      - name: Ping trigger tests
        run: python tests/test_ping.py

      - name: Deriver split tests
        run: python tests/test_deriver.py

      - name: Routable LFO tests
        run: python tests/test_lfo.py

      - name: Threshold tests
        run: python tests/test_threshold.py

      - name: Gate suite tests
        run: python tests/test_gate.py

      - name: Transport card tests
        run: python tests/test_transport.py

      # The device-start STALL needs a Mac, but the fallback logic around it
      # does not — and that logic is what decides whether the engine boots at
      # all. tests/audio_proof.py is the Mac-only other half.
      - name: Audio session / device fallback tests
        run: python tests/test_audio_session.py

      # pure Python (no server, no numpy) — it guards the power-sine
      # coefficient law against a silent refactor. It existed and passed
      # for its whole life without any job running it.
      - name: Power-sine coefficient law
        run: python tests/test_power_sine.py

      # the REACTIVE-INDICATOR net: every binary endpoint the gate settle
      # pass drives must emit its own tap. Without this, all four
      # _emit_level calls could be deleted and every suite above stayed
      # green — the GUI checks never import synthbase. This is Phase 0 of
      # continuity/ai-control-build-plan.md, which names the file
      # tests/test_events.py; it landed here first, as test_reactive.py.
      - name: Reactive-indicator tests
        run: python tests/test_reactive.py

      # items 10 and 29 — the allocation framework (mono/poly/hold policies,
      # slot leasing, stealing) and the drone-as-Hold card. Added by the BATCH
      # MERGE, not by either originating branch: both were written against a
      # base where nothing required a CI entry, and the rule requiring one
      # arrives in THIS commit. Neither branch was wrong alone. Note
      # test_allocation.py pins all three leak fixes, so it must be referenced
      # rather than dropped.
      - name: Allocation framework tests
        run: python tests/test_allocation.py

      - name: Drone allocation tests
        run: python tests/test_drone_alloc.py

      # Item 37 Phase 1's headless half — the transcript round-trip, the
      # normaliser Phase 2 diffs through, the stuck-note walker, the scenario
      # grammar, and the check that rig.py's spawn/remove table still matches
      # what server.py dispatches. CI-safe by construction: no rig, no
      # scsynth, no MIDI, no net (the live half is probe_rig_ws.py, Mac-only).
      - name: Rig driver + transcript tests
        run: python tests/test_rig.py

      # Item 37 Phase 2, EMISSION half. Re-records each scenario against this
      # commit through tests/silent_rig.py — the real GuiServer over an
      # engine-less SynthApp — and diffs the event stream against the
      # committed transcripts. No scsynth, no audio device, ~1 s per
      # scenario. This is the check that goes red when the backend stops
      # emitting; the nine suites above stay green through that mutation.
      - name: Transcript replay — backend emissions
        run: python tests/check_replay.py --emission

  gui-checks:
    name: GUI checks (headless Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tests/gui_check8.py locates Chromium via a hardcoded path glob
      # (/opt/pw-browsers/chromium-*/...), matching the dev sandbox this
      # repo has been built in. Install Playwright's browser to that same
      # location here so the existing test script finds it unmodified.
      # GitHub-hosted runners grant the default user passwordless sudo,
      # which we need since /opt isn't writable by default.
      - name: Prepare browser install location
        run: |
          sudo mkdir -p /opt/pw-browsers
          sudo chown "$(whoami)" /opt/pw-browsers

      - name: Install Playwright + Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run GUI checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: python tests/gui_check8.py

      - name: Blocks UI checks (mock ws)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: python tests/check_blocks.py

      - name: Blocks UI real-state replay
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: python tests/check_real.py

      # Item 37 Phase 2, DOM half. Replays the committed transcripts —
      # RECORDINGS of what the server said, not messages a check invented —
      # through check_blocks' websocket stub, and asserts the endpoint x
      # surface matrix at both edges. Needs no synthbase: this job installs
      # playwright only, and check_replay reports the emission plane as
      # skipped rather than failing on the missing import.
      - name: Transcript replay — GUI surfaces
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: python tests/check_replay.py --dom
